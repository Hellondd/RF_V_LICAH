<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регион — Россия в лицах</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo"><div class="logo-flag"></div>Россия в лицах</a>
            <ul class="nav-menu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="history.html">История</a></li>
                <li><a href="regions.html">Регионы</a></li>
                <li><a href="persons.html">Лица</a></li>
                <li><a href="achievements.html">Достижения</a></li>
                <li><a href="multinational.html">Многонациональная</a></li>
                <li><a href="quiz.html">Викторина</a></li>
                <li><a href="postcard.html">Открытка</a></li>
                <li><a href="regions.html">← Назад</a></li>
            </ul>
            <div id="navUserArea" class="nav-actions"></div>
        </nav>
    </header>
    <main id="regionContent"><div class="empty-state">Загрузка...</div></main>
    <footer><p>© 2026 Студенческая проектная группа. Производственная практика.</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const id = new URLSearchParams(location.search).get('id');
        if (!id) location.href = 'regions.html';
        api.get(`/regions/${id}`).then(({ data: r }) => {
            document.getElementById('regionContent').innerHTML = `
                <div class="card"><div class="card-content">
                    <span class="card-tag">${r.federal_district}</span>
                    <h1>${r.title}</h1>
                    <p><strong>Столица:</strong> ${r.capital}</p>
                    <p>${r.full_description}</p>
                    ${r.facts ? '<h3>Факты</h3><ul>' + r.facts.map(f => `<li>${f}</li>`).join('') + '</ul>' : ''}
                    ${r.culture ? `<h3>Культура</h3><p>${r.culture}</p>` : ''}
                    ${r.achievements ? `<h3>Достижения</h3><p>${r.achievements}</p>` : ''}
                </div></div>`;
            document.title = r.title + ' — Россия в лицах';
        }).catch(() => {
            document.getElementById('regionContent').innerHTML = '<div class="empty-state">Регион не найден</div>';
        });
    </script>
</body>
</html>
