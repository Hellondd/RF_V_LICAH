<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Россия в лицах</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-flag"></div>
                Россия в лицах
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="history.html">История</a></li>
                <li><a href="regions.html">Регионы</a></li>
                <li><a href="persons.html">Лица</a></li>
                <li><a href="achievements.html">Достижения</a></li>
                <li><a href="multinational.html">Многонациональная</a></li>
                <li><a href="quiz.html">Викторина</a></li>
                <li><a href="postcard.html">Открытка</a></li>
            </ul>
            <div id="navUserArea" class="nav-actions"></div>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h1>Вход</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div id="errorMsg" class="form-error" style="display:none"></div>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            <p class="form-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
            <p class="form-link" style="font-size:13px;color:#888">Демо: demo@example.com / demo123</p>
        </div>
    </main>

    <footer><p>© 2026 Студенческая проектная группа. Производственная практика.</p></footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('errorMsg');
            errorEl.style.display = 'none';
            try {
                const { data } = await api.post('/auth/login', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                });
                Auth.saveSession(data.access_token, data.user);
                window.location.href = 'cabinet.html';
            } catch (err) {
                errorEl.textContent = err.response?.data?.detail || 'Ошибка входа';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
